name: Build SetupLap Overlay V2

on:
  push:
    branches: [ main ]
    paths:
      - 'overlay-v2/**'
      - '.github/workflows/build-overlay-v2.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'overlay-v2/**'
      - '.github/workflows/build-overlay-v2.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore overlay-v2/SetupLap.Overlay/SetupLap.Overlay.csproj
      - name: Publish V2
        run: dotnet publish overlay-v2/SetupLap.Overlay/SetupLap.Overlay.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o overlay-v2-publish
      - uses: actions/upload-artifact@v4
        with:
          name: SetupLapOverlay-V2-win-x64
          path: overlay-v2-publish/**
          if-no-files-found: error
